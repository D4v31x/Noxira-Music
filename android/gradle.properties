org.gradle.jvmargs=-Xmx4608m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=true
kotlin.jvm.target.validation.mode = IGNORE
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.configureondemand=true
org.gradle.daemon=true

# Kotlin performance
# Incremental compilation is off: the pub cache (C:) and the project (E:) are on
# different drives, which makes Kotlin's incremental caches fail with
# "this and base files have different roots".
kotlin.incremental=false
kotlin.code.style=official

# R8 full mode for better optimization
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
