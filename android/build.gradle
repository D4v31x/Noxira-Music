allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdk = 36
            }
        }
    }
}

// firebase_remote_config is written in Kotlin and, on AGP 9, expects built-in
// Kotlin support, which this project keeps disabled (android.builtInKotlin=false)
// for the sake of other plugins. Apply the Kotlin plugin to it explicitly.
subprojects {
    if (project.name == 'firebase_remote_config') {
        project.plugins.withId('com.android.library') {
            project.apply plugin: 'org.jetbrains.kotlin.android'
        }
    }
}

ext.kotlin_version = '2.2.20'

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
